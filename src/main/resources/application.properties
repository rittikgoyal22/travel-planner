spring.application.name=travel-planner
server.port=8082

# MySQL database connection
# Secrets (password) and environment-specific values are supplied via environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travel_planner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Shared JWT secret — no default: must be supplied via env var and identical across all services
jwt.secret=${JWT_SECRET}

# auth-service URL for blacklist check
auth.service.base_url=${AUTH_SERVICE_BASE_URL:http://localhost:8080/}

# account management service URLs
account.management.service.base_url=${ACCOUNT_MANAGEMENT_SERVICE_BASE_URL:http://localhost:8081/}
account.management.service.url=api/
account.management.service.skip=false
